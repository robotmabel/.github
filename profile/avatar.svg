<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MABEL the robot">
  <defs>
    <pattern id="ht" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="4" cy="4" r="2.6" fill="#151820" opacity="0.08"/>
    </pattern>
    <pattern id="htd" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <circle cx="4" cy="4" r="2.8" fill="#C24E12" opacity="0.5"/>
    </pattern>
  </defs>
  <!-- orange tile like the website icon -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="#F0762E"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="url(#ht)"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#151820" stroke-width="10" opacity="0.9"/>
  <!-- halftone glow behind the robot -->
  <circle cx="256" cy="278" r="205" fill="url(#htd)" opacity="0.45"/>

  <!-- lift column + base -->
  <rect x="240" y="336" width="32" height="56" fill="#FFF9F0" stroke="#151820" stroke-width="9"/>
  <rect x="168" y="386" width="176" height="76" rx="24" fill="#FFF9F0" stroke="#151820" stroke-width="12"/>
  <rect x="234" y="428" width="44" height="12" rx="6" fill="#151820"/>

  <!-- arms (hang at the sides like the real robot) -->
  <g fill="#FFF9F0" stroke="#151820" stroke-width="9">
    <rect x="148" y="250" width="36" height="66" rx="17"/>
    <circle cx="166" cy="322" r="15"/>
    <rect x="151" y="324" width="30" height="56" rx="14"/>
    <circle cx="166" cy="390" r="17"/>
    <rect x="328" y="250" width="36" height="66" rx="17"/>
    <circle cx="346" cy="322" r="15"/>
    <rect x="331" y="324" width="30" height="56" rx="14"/>
    <circle cx="346" cy="390" r="17"/>
  </g>

  <!-- torso -->
  <rect x="184" y="226" width="144" height="112" rx="28" fill="#FFF9F0" stroke="#151820" stroke-width="12"/>
  <circle cx="176" cy="252" r="18" fill="#FFF9F0" stroke="#151820" stroke-width="9"/>
  <circle cx="336" cy="252" r="18" fill="#FFF9F0" stroke="#151820" stroke-width="9"/>

  <!-- neck -->
  <rect x="238" y="206" width="36" height="24" rx="9" fill="#FFF9F0" stroke="#151820" stroke-width="9"/>

  <!-- head: the website icon's face -->
  <rect x="176" y="102" width="160" height="106" rx="42" fill="#FFF9F0" stroke="#151820" stroke-width="12"/>
  <rect x="193" y="119" width="126" height="72" rx="30" fill="none" stroke="#F0762E" stroke-width="8"/>
  <circle cx="226" cy="156" r="17" fill="#151820"/>
  <circle cx="286" cy="156" r="17" fill="#151820"/>
  <circle cx="232" cy="150" r="6" fill="#FFF9F0"/>
  <circle cx="292" cy="150" r="6" fill="#FFF9F0"/>
  <path d="M240 179 q16 12 32 0" fill="none" stroke="#151820" stroke-width="8" stroke-linecap="round"/>

  <!-- antennas -->
  <g stroke="#FFF9F0" stroke-width="13" stroke-linecap="round">
    <line x1="214" y1="110" x2="176" y2="56"/>
    <line x1="298" y1="110" x2="336" y2="56"/>
  </g>
  <g stroke="#151820" stroke-width="6">
    <circle cx="176" cy="56" r="12" fill="#FFF9F0"/>
    <circle cx="336" cy="56" r="12" fill="#FFF9F0"/>
  </g>
</svg>